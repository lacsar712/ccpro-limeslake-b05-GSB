{% extends "base.html" %}
{% block title %}图例偏好{% endblock %}
{% block content %}
<section class="legend-page">
  <header class="floor-head">
    <div>
      <h1>图例偏好</h1>
      <p>勾选后，对应状态的池位瓦片会显示在平面图网格；取消勾选则隐藏。保存后对所有人生效。</p>
    </div>
    <a class="btn ghost" href="{{ url_for('board.floor_plan') }}">返回平面图</a>
  </header>

  <div class="panel legend-panel">
    {% if not is_admin %}
    <p class="hint legend-readonly-note">
      当前为操作工账号：图例偏好仅可查看，勾选与保存需管理员进行。
    </p>
    {% endif %}

    <form method="post" action="{{ url_for('legend.save_preferences') }}" class="legend-form">
      <label class="legend-check">
        <input
          type="checkbox"
          name="show_filling"
          {% if visibility['filling'] %}checked{% endif %}
          {% if not is_admin %}disabled{% endif %}
        />
        <span class="leg-item filling">注水中</span>
        <span class="legend-check-hint">网格中显示「注水中」瓦片</span>
      </label>
      <label class="legend-check">
        <input
          type="checkbox"
          name="show_slaking"
          {% if visibility['slaking'] %}checked{% endif %}
          {% if not is_admin %}disabled{% endif %}
        />
        <span class="leg-item slaking">熟化中</span>
        <span class="legend-check-hint">网格中显示「熟化中」瓦片</span>
      </label>
      <label class="legend-check">
        <input
          type="checkbox"
          name="show_drawn"
          {% if visibility['drawn'] %}checked{% endif %}
          {% if not is_admin %}disabled{% endif %}
        />
        <span class="leg-item drawn">已出灰</span>
        <span class="legend-check-hint">网格中显示「已出灰」瓦片</span>
      </label>

      {% if is_admin %}
      <div class="actions">
        <button type="submit">保存偏好</button>
        <a class="btn ghost" href="{{ url_for('board.floor_plan') }}">取消</a>
      </div>
      {% endif %}
    </form>
  </div>
</section>
{% endblock %}
